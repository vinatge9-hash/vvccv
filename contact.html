<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Contact - FitCore Studio</title>
  <meta name='description' content='Get in touch with FitCore Studio for memberships, questions, or booking a tour.'>
  <link rel='preconnect' href='https://fonts.googleapis.com'>
  <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
  <link href='https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap' rel='stylesheet'>
  <script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='font-sans'>
  <header>
    <nav class='bg-white shadow sticky top-0 z-50'>
      <div class='max-w-7xl mx-auto px-4'>
        <div class='flex items-center justify-between h-16'>
          <a href='index.html' class='text-2xl font-bold text-gray-800 font-[Oswald]'>FitCore Studio</a>
          <div class='hidden md:flex space-x-6'>
            <a href='index.html' class='text-gray-600 hover:text-gray-900'>Home</a>
            <a href='about.html' class='text-gray-600 hover:text-gray-900'>About</a>
            <a href='contact.html' class='text-gray-600 hover:text-gray-900'>Contact</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <section class='relative min-h-screen bg-cover bg-center' style='background-image: url("https://pixabay.com/get/gad479e8e81ace6f14094a7efa01b46ad066e9a97b6a6203a4c837240320a7f03df0e25fdad694f20adbde66d9d9e7aca5c67f1bb9ec314179441436768ef39fb_640.jpg");'>
    <div class='absolute inset-0 bg-black opacity-40'></div>
    <div class='relative z-10 flex items-center justify-center h-full text-center text-white px-4'>
      <div class='max-w-2xl'>
        <h1 class='font-[Oswald] text-4xl md:text-6xl font-bold mb-4'>Contact FitCore Studio</h1>
        <p class='font-[Roboto] text-lg'>Have questions or want to schedule a tour? Send us a message and we’ll get back to you fast.</p>
      </div>
    </div>
  </section>

  <main class='py-16'>
    <section class='max-w-3xl mx-auto px-4'>
      <form action='#' method='post' class='space-y-4'>
        <div>
          <label class='block text-sm mb-1'>Name</label>
          <input type='text' name='name' required class='w-full px-3 py-2 rounded border border-gray-300'>
        </div>
        <div>
          <label class='block text-sm mb-1'>Email</label>
          <input type='email' name='email' required class='w-full px-3 py-2 rounded border border-gray-300'>
        </div>
        <div>
          <label class='block text-sm mb-1'>Message</label>
          <textarea name='message' rows='5' required class='w-full px-3 py-2 rounded border border-gray-300'></textarea>
        </div>
        <button type='submit' class='bg-blue-600 text-white px-6 py-3 rounded-md hover:bg-blue-700'>Send Message</button>
      </form>
    </section>
  </main>

  <footer class='bg-gray-900 text-white py-12'>
    <div class='max-w-3xl mx-auto px-4 text-sm opacity-80'>© 2025 FitCore Studio. All rights reserved.</div>
  </footer>
</body>
</html>
